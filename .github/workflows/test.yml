name: Quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run unit, API and browser E2E
        run: pytest -q
      - name: Check tracked files for credentials and local files
        run: |
          python - <<'PY'
          import pathlib, re, subprocess
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          assert not any(p.startswith('.env') and p != '.env.example' for p in tracked)
          assert not any(p.endswith(('.pem','.key','.p12')) or '/.vercel/' in p for p in tracked)
          for file in tracked:
              p = pathlib.Path(file)
              if p.is_file() and p.suffix in ('.py','.md','.html','.yml','.yaml','.txt'):
                  text = p.read_text(errors='replace')
                  # Does not claim to detect all secrets; blocks common literal key patterns.
                  assert not re.search(r'sk-(?:proj-)?[A-Za-z0-9_-]{40,}', text), file
          PY
